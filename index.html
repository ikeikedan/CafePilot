<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CafePilot</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="home">

    <h1>☕ CafePilot</h1>

    <h2>いらっしゃいませ</h2>

    <p>何名様ですか？</p>

    <button onclick="selectGuest(1)">1名</button>

    <button onclick="selectGuest(2)">2名</button>

    <button onclick="selectGuest(4)">3〜4名</button>

    <button onclick="selectGuest(6)">5名以上</button>

</div>

<div id="map" style="display:none;">

<h2>空いている席をお選びください</h2>

<div class="floor">

<div class="seat two" id="seat8" onclick="selectSeat(8)">⑧</div>

<div class="seat two" id="seat7" onclick="selectSeat(7)">⑦</div>

<div class="seat two" id="seat6" onclick="selectSeat(6)">⑥</div>

<div class="seat four" id="seat5" onclick="selectSeat(5)">⑤</div>

<div class="seat four" id="seat4" onclick="selectSeat(4)">④</div>

<div class="seat two" id="seat3" onclick="selectSeat(3)">③</div>

<div class="seat two" id="seat2" onclick="selectSeat(2)">②</div>

<div class="seat two" id="seat1" onclick="selectSeat(1)">①</div>

</div>

</div>

<div id="result" style="display:none;">

<h1 id="seatNumber"></h1>

<p>こちらのお席へどうぞ</p>

</div>

<script src="app.js"></script>

</body>
</html>
