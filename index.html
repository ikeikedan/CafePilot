<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>CafePilot</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== -->
<!-- 受付画面 -->
<!-- ===================== -->
<section id="screen-welcome" class="screen active">

    <h1>CafePilot</h1>

    <h2>いらっしゃいませ</h2>

    <p class="sub">
        何名様ですか？
    </p>

    <div class="people-buttons">

        <button class="people-btn" data-people="1">1名</button>
        <button class="people-btn" data-people="2">2名</button>
        <button class="people-btn" data-people="3">3名</button>
        <button class="people-btn" data-people="4">4名</button>
        <button class="people-btn" data-people="5">5名</button>
        <button class="people-btn" data-people="6">6名</button>

    </div>

</section>



<!-- ===================== -->
<!-- 席マップ -->
<!-- ===================== -->

<section id="screen-map" class="screen">

    <h2>お好きな席をお選びください</h2>

    <div id="seat-map" class="seat-map">

    </div>

</section>



<!-- ===================== -->
<!-- 席確認 -->
<!-- ===================== -->

<section id="screen-seat" class="screen">

    <h2 id="seat-title"></h2>

    <div class="seat-preview">

        <div id="seat-number"
             class="seat-preview-box">
        </div>

    </div>

    <div class="button-area">

        <button id="back-map-btn"
                class="secondary">
            他の席を見る
        </button>

        <button id="confirm-btn"
                class="primary">
            この席にする
        </button>

    </div>

</section>



<!-- ===================== -->
<!-- 完了画面 -->
<!-- ===================== -->

<section id="screen-complete" class="screen">

    <h2>ありがとうございます</h2>

    <p>

        スタッフがご案内いたします

    </p>

    <div class="complete-seat">

        <span id="complete-seat-number"></span>

    </div>

    <p id="countdown"></p>

</section>



<script src="app.js"></script>

</body>
</html>
